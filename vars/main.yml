---
# Internal values, not meant to be overridden. User settings are in defaults/main.yml.

chrome_win_cis_benchmark: "CIS Google Chrome Benchmark v3.0.0"

# Registry keys behind the Group Policy settings named in the benchmark's Audit sections
chrome_win_cis_policy_key: 'HKLM:\SOFTWARE\Policies\Google\Chrome'
chrome_win_cis_update_key: 'HKLM:\SOFTWARE\Policies\Google\Update'

# Google's 64-bit Enterprise MSI (always the newest stable; Google publishes no older MSIs)
chrome_win_cis_msi_url: https://dl.google.com/chrome/install/googlechromestandaloneenterprise64.msi

# Where chrome.exe lives: 64-bit installs first, older 32-bit installs second
chrome_win_cis_exe_paths:
  - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'

# Path of the installed chrome.exe, empty = not installed (prelim checks its length)
chrome_win_cis_installed: >-
  {{ discovered_chrome_win_cis_exe.results | default([]) | selectattr('stat.exists')
     | map(attribute='item') | first | default('') }}

# post.yml splits the collected policies by how the registry stores them:
# lists (e.g. ["*"]) become a subkey with values 1, 2, 3 ...; everything else is one value
chrome_win_cis_list_policies: >-
  {{ chrome_win_cis_policies | dict2items | selectattr('value', 'iterable') | rejectattr('value', 'string') | list }}
chrome_win_cis_value_policies: "{{ chrome_win_cis_policies | dict2items | difference(chrome_win_cis_list_policies) }}"
