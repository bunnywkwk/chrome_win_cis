---
# One list policy in one browser key: chrome_win_cis_list.0 = key, .1.key = policy name, .1.value = its items.
# Stored like Group Policy does it: subkey <policy> with values 1, 2, 3 ... (empty list = no values).
- name: "POST | AUDIT | Read the current items of {{ chrome_win_cis_list.1.key }}"
  ansible.windows.win_reg_stat:
    path: "{{ chrome_win_cis_list.0 }}\\{{ chrome_win_cis_list.1.key }}"
  register: discovered_chrome_win_cis_list

- name: "POST | PATCH | Write the items of {{ chrome_win_cis_list.1.key }}"
  ansible.windows.win_regedit:
    path: "{{ chrome_win_cis_list.0 }}\\{{ chrome_win_cis_list.1.key }}"
    name: "{{ ansible_loop.index }}"
    data: "{{ item }}"
    type: string
  loop: "{{ chrome_win_cis_list.1.value }}"
  loop_control:
    extended: true

- name: "POST | PATCH | Remove items no longer in {{ chrome_win_cis_list.1.key }}"
  ansible.windows.win_regedit:
    path: "{{ chrome_win_cis_list.0 }}\\{{ chrome_win_cis_list.1.key }}"
    name: "{{ item }}"
    state: absent
  loop: "{{ discovered_chrome_win_cis_list.properties | default({}) | list | difference(range(1, chrome_win_cis_list.1.value | length + 1) | map('string') | list) }}"
