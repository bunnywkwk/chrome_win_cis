    - level1
    - automated
    - patch
    - rule_1.3
    - enforced_defaults
  ansible.builtin.set_fact:
    chrome_win_cis_policies: "{{ chrome_win_cis_policies | combine({'MediaRouterCastAllowAllIPs': false}) }}"

