---
# Every policy goes into the key of every browser found (item.0 = key, item.1 = policy)
- name: "POST | PATCH | Write the single-value policies"
  ansible.windows.win_regedit:
    path: "{{ item.0 }}"
    name: "{{ item.1.key }}"
    data: "{{ item.1.value | int if item.1.value is boolean else item.1.value }}"
    type: "{{ 'string' if item.1.value is string else 'dword' }}"
  loop: "{{ chrome_win_cis_policy_keys | product(chrome_win_cis_value_policies) | list }}"
  loop_control:
    label: "{{ item.0 }}\\{{ item.1.key }}"

- name: "POST | PATCH | Write the list policies"
  ansible.builtin.include_tasks:
    file: post_list.yml
    apply:
      tags:
        - always
  loop: "{{ chrome_win_cis_policy_keys | product(chrome_win_cis_list_policies) | list }}"
  loop_control:
    loop_var: chrome_win_cis_list
    label: "{{ chrome_win_cis_list.0 }}\\{{ chrome_win_cis_list.1.key }}"

- name: "POST | AUDIT | Report"
  ansible.builtin.debug:
    msg:
      benchmark: "{{ chrome_win_cis_benchmark }}"
      chrome: "{{ chrome_win_cis_chrome_found }}"
      chromium: "{{ chrome_win_cis_chromium_found }}"
      browser_major: "{{ chrome_win_cis_browser_major }}"
      policy_keys: "{{ chrome_win_cis_policy_keys }}"
      policies_written: "{{ chrome_win_cis_policies | length }}"
      levels: "Level 1 {{ 'on' if chrome_win_cis_level_1 else 'off' }}, Level 2 {{ 'on' if chrome_win_cis_level_2 else 'off' }}"
